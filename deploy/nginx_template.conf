# ==============================================================================
# CONFIGURAÇÃO DO NGINX PARA AGENDA DE SALAS
# ==============================================================================
# Este modelo configura o Nginx como Proxy Reverso central com suporte a SSL/HTTPS
# e redirecionamento de HTTP para HTTPS, além de permitir conexões WebSocket (WSS).

# 1. BLOCO HTTP (Porta 80) - Redirecionamento automático para HTTPS
server {
    listen 80;
    server_name agendasalas; # Ou o hostname/IP público configurado

    # Redireciona qualquer requisição HTTP (porta 80) para HTTPS (porta 443) de forma permanente (301)
    return 301 https://$host$request_uri;
}

# 2. BLOCO HTTPS (Porta 443) - Servindo a aplicação de forma segura e configurando WebSockets
server {
    listen 443 ssl;
    server_name agendasalas; # Ou o hostname/IP público configurado

    # Caminho dos certificados SSL validados no servidor
    ssl_certificate     /etc/nginx/certs/agendasalas.crt;
    ssl_certificate_key /etc/nginx/certs/agendasalas.key;

    # Protocolos e Cifras recomendados para segurança
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Proxy para a Aplicação Web (Frontend React)
    location / {
        # Encaminha o tráfego para a porta exposta pelo container de frontend (ex: 8090)
        proxy_pass http://10.10.1.206:8090;

        # Cabeçalhos padrão para repassar informações reais do cliente à aplicação
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Proxy específico para conexões WebSocket (necessário para atualização em tempo real)
    location /ws {
        # Encaminha o tráfego para a porta exposta pelo container de frontend (onde roda o proxy interno do React/Nginx)
        proxy_pass http://10.10.1.206:8090;

        # Configurações obrigatórias para fazer o Upgrade da conexão de HTTP normal para WebSocket (WSS)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Cabeçalhos padrão adicionais
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
