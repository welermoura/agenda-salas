# Configuração do Apache para a aplicação __HOSTNAME__
# /etc/apache2/sites-available/__HOSTNAME__.conf

<VirtualHost *:80>
    ServerName __HOSTNAME__

    DocumentRoot /var/www/__HOSTNAME__

    # Ativa o motor de reescrita
    RewriteEngine On

    # --- REGRAS DE PROXY REVERSO ---
    # A ordem é crucial. As regras mais específicas (API/WebSocket) vêm primeiro.

    # 1. Proxy para o WebSocket
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws(.*) ws://127.0.0.1:8000/ws$1 [P,L]

    # 2. Proxy para a API
    # Captura qualquer requisição que comece com /api/ e a envia para o backend.
    # O [P] faz o proxy, e o [L] impede que as regras abaixo sejam processadas.
    RewriteRule ^/api/(.*)$ http://127.0.0.1:8000/api/$1 [P,L]


    # --- REGRAS PARA SERVIR O FRONTEND (SINGLE PAGE APPLICATION) ---
    # Estas regras só são aplicadas se as regras de proxy acima não corresponderem.

    # 1. Não reescrever URLs para arquivos existentes
    # Se o arquivo ou diretório solicitado existir fisicamente no DocumentRoot, sirva-o diretamente.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -f [OR]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    # 2. Rota de Fallback para a SPA
    # Para qualquer outra requisição, sirva o index.html.
    # Isso permite que o roteador do React (react-router-dom) controle a navegação.
    RewriteRule . /index.html [L]


    # --- Configurações de Diretório e Logs ---
    <Directory /var/www/__HOSTNAME__>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/__HOSTNAME___error.log
    CustomLog ${APACHE_LOG_DIR}/__HOSTNAME___access.log combined

</VirtualHost>
