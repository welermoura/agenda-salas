# Configuração do Apache para a aplicação AgendaSalas
# /etc/apache2/sites-available/agendasalas.conf

<VirtualHost *:80>
    ServerName agendasalas

    # Local onde os arquivos de build do frontend serão armazenados
    DocumentRoot /var/www/agendasalas

    # Ativa o motor de reescrita de URL
    RewriteEngine On

    # --- Proxy Reverso para o WebSocket ---
    # Redireciona as requisições WebSocket para o backend
    # A flag [P] significa "Proxy"
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8000/$1 [P,L]

    # --- Proxy Reverso para a API ---
    # Redireciona as requisições da API para o backend
    ProxyPass /agendas http://127.0.0.1:8000/agendas
    ProxyPassReverse /agendas http://127.0.0.1:8000/agendas

    # --- Servir o Frontend (Single Page Application) ---
    # Se o arquivo ou diretório solicitado não existir,
    # serve o index.html. Isso é essencial para o roteamento do React.
    <Directory /var/www/agendasalas>
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]

        # Concede as permissões necessárias para o diretório
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/agendasalas_error.log
    CustomLog ${APACHE_LOG_DIR}/agendasalas_access.log combined

</VirtualHost>
