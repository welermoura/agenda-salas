# Configuração do Apache para a aplicação AgendaSalas
# /etc/apache2/sites-available/agendasalas.conf

<VirtualHost *:80>
    ServerName agendasalas

    # Local onde os arquivos de build do frontend serão armazenados
    DocumentRoot /var/www/agendasalas

    # Ativa o motor de reescrita de URL
    RewriteEngine On

    # --- REGRAS DE PROXY REVERSO ---
    # A ordem aqui é crucial. As regras mais específicas devem vir primeiro.

    # 1. Proxy para o WebSocket
    # Captura requisições de upgrade para WebSocket e as envia para o backend.
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/ws/?(.*) ws://127.0.0.1:8000/ws/$1 [P,L]

    # 2. Proxy para a API
    # Captura requisições para /agendas e as envia para o backend.
    RewriteRule ^/agendas(.*) http://127.0.0.1:8000/agendas$1 [P,L]


    # --- REGRA PARA SERVIR O FRONTEND (SINGLE PAGE APPLICATION) ---
    # Esta regra só é aplicada se as regras de proxy acima não forem.

    # 3. Servir arquivos existentes diretamente
    # Se o arquivo ou diretório solicitado existir fisicamente, sirva-o.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -f [OR]
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]

    # 4. Rota de Fallback para a SPA
    # Para qualquer outra requisição, sirva o index.html.
    # Isso permite que o roteador do React (react-router-dom) controle a navegação.
    RewriteRule ^ /index.html [L]


    # --- Configurações de Diretório e Logs ---
    <Directory /var/www/agendasalas>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/agendasalas_error.log
    CustomLog ${APACHE_LOG_DIR}/agendasalas_access.log combined

</VirtualHost>
