  --primary-bg: #282c34;
  --secondary-bg: #3c4049;
  --text-color: #ffffff;
  --accent-color: #61dafb;
  --status-livre: #4caf50;
  --status-ocupado: #f44336;
  --status-desconhecido: #9e9e9e;
  --error-color: #ff5252;
  --success-color: #69f0ae;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
    'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
    sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background-color: var(--primary-bg);
  color: var(--text-color);
}

.App {
  text-align: center;
}

.main-nav {
  background-color: var(--secondary-bg);
  padding: 1rem;
  display: flex;
  justify-content: center;
  gap: 2rem;
  border-bottom: 2px solid var(--accent-color);
}

.main-nav a {
  color: var(--text-color);
  text-decoration: none;
  font-size: 1.2rem;
  padding: 0.5rem 1rem;
  border-radius: 5px;
  transition: background-color 0.3s;
}

.main-nav a:hover, .main-nav a.active {
  background-color: var(--accent-color);
  color: var(--primary-bg);
}

main {
  padding: 2rem;
}

/* AdminPage Styles */
.admin-page {
  max-width: 800px;
  margin: 0 auto;
  padding: 2rem;
  background-color: var(--secondary-bg);
  border-radius: 8px;
}

.admin-page h2, .admin-page h3 {
  color: var(--accent-color);
}

.admin-page form {
  display: flex;
  gap: 1rem;
  margin-bottom: 2rem;
}

.admin-page input[type="text"] {
  flex-grow: 1;
  padding: 0.8rem;
  border: 1px solid var(--accent-color);
  background-color: var(--primary-bg);
  color: var(--text-color);
  border-radius: 5px;
}

.admin-page button {
  padding: 0.8rem 1.5rem;
  border: none;
  background-color: var(--accent-color);
  color: var(--primary-bg);
  cursor: pointer;
  border-radius: 5px;
  transition: background-color 0.3s;
}

.admin-page button:hover {
  background-color: #ffffff;
}

.agendas-list ul {
  list-style: none;
  padding: 0;
}

.agendas-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: var(--primary-bg);
  padding: 1rem;
  border-radius: 5px;
  margin-bottom: 0.5rem;
}

.agendas-list li button {
  background-color: var(--error-color);
  color: var(--text-color);
}

.error-message {
  color: var(--error-color);
  background-color: rgba(255, 82, 82, 0.2);
  padding: 1rem;
  border-radius: 5px;
  margin-bottom: 1rem;
}

.success-message {
  color: var(--success-color);
  background-color: rgba(105, 240, 174, 0.2);
  padding: 1rem;
  border-radius: 5px;
  margin-bottom: 1rem;
}

/* DashboardPage Styles */
.dashboard-page {
  width: 95%;
  margin: 0 auto;
}

.schedule-grid {
  display: grid;
  grid-template-columns: 150px repeat(15, 1fr);
  gap: 2px;
  background-color: var(--secondary-bg);
  padding: 10px;
  border-radius: 8px;
  overflow-x: auto;
}

.grid-header, .grid-row {
  display: contents;
}

.grid-header > div, .grid-row > div {
  padding: 10px;
  background-color: var(--primary-bg);
  text-align: center;
  white-space: nowrap;
}

.sala-header, .sala-nome {
  font-weight: bold;
  position: sticky;
  left: 0;
  z-index: 1;
}

.grid-cell {
  height: 30px;
  border-radius: 4px;
}

.status-livre { background-color: var(--status-livre); }
.status-ocupado { background-color: var(--status-ocupado); }
.status-desconhecido { background-color: var(--status-desconhecido); }
