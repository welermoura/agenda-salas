version: '3.8'

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    volumes:
      # Monta o diretório 'data' para persistir a configuração e outros dados
      - ./data:/app/data
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      # Expõe a porta 80 do container na porta 8080 do host
      # Pode alterar 8080 para qualquer porta que desejar (ex: 80)
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
